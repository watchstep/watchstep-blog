[build]
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20.10.0"
  NPM_VERSION = "10.2.4"
  HUGO_VERSION = "0.145.0"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[context.next]
  command = "npm run build"

[context.next.environment]
  HUGO_ENV = "next"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 1313
  port = 8888
  publish = "public"
  autoLaunch = false

[[redirects]]
  from = "/blog/"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/deep-researcher-with-test-time-diffusion-google-cloud2025-논문-리뷰/"
  to = "/posts/paper_ttd-dr/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/effective-context-engineering-for-ai-agents-anthropic-2025-09-29/"
  to = "/posts/effective_context_engineering_anthropic/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/pynecone-시작하기-python으로-웹앱-만들기/"
  to = "/posts/pynecone_start/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/matryoshka-representation-learning-2022-논문-리뷰-feat.-embeddinggemma/"
  to = "/posts/mrl/"
  status = 301
  force = true

# Custom headers
[[headers]]
  for = "/*"
  [headers.values]
    # 보안 헤더
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options   = "nosniff"
    X-XSS-Protection         = "1; mode=block"
    X-Frame-Options          = "SAMEORIGIN"
    Referrer-Policy          = "strict-origin"
    Permissions-Policy       = "geolocation=(self), microphone=(), camera=()"

    # CSP 조정: lazyload/inline 스크립트, utterances, 외부 이미지 허용
    Content-Security-Policy  = """
      default-src 'self';
      img-src 'self' https: data: blob:;
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://utteranc.es;
      style-src  'self' 'unsafe-inline';
      font-src   'self' data: https://cdn.jsdelivr.net;
      connect-src 'self' https://utteranc.es https://api.github.com;
      frame-src https://utteranc.es;
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'self';
      upgrade-insecure-requests;
    """

    # SEO 안정화: HTML, sitemap.xml, robots.txt, 404 응답이 오래 캐시되지 않도록 조정
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
